    - "대부중개"
    - "부동산 양도"
    - "부동산 매매"

# 미래에셋생명 관련성 채점 — 중요도와 별도로 등급 안 정렬과 ★ 표시에 사용.
# L1(법령·협회규정)은 snapshot(comp_matching_auto 사규-법령 매칭 산출물)에서,
# L2(생보 특화 키워드)는 아래 term_weights에서 가져온다.
# 스냅샷 갱신: python3 scripts/export_company_law_snapshot.py
relevance:
  enabled: true
  snapshot_path: "data/company_relevance_snapshot.json"
  # ★ 당사 관련 판정은 생보 직접 신호를 우선하고, 손보 전용 신호만 있는
  # 항목은 일반 보험어 점수가 높아도 29점으로 제한한다.
  life_terms:
    - "미래에셋생명"
    - "생명보험"
    - "생명보험협회"
    - "종신보험"
    - "정기보험"
    - "변액"
    - "연금보험"
    - "퇴직연금"
    - "즉시연금"
    - "사망보험금"
    - "보험수익자"
    - "공시이율"
    - "예정이율"
    - "계약자적립액"
  nonlife_terms:
    - "자동차보험"
    - "자동차종합보험"
    - "대차료"
    - "렌트비"
    - "대인배상"
    - "대물배상"
    - "차량수리"
    - "화재보험"
    - "재산보험"
    - "배상책임보험"
    - "보증보험"
    - "해상보험"
  term_weights:
    # 회사 직접 언급
    "미래에셋생명": 60
    "미래에셋": 25
    # 생보 상품·제도 직결 (30점대)
    "변액": 30
    "퇴직연금": 30
    "지급여력": 30
    "K-ICS": 30
    "킥스": 30
    "IFRS17": 25
    "방카슈랑스": 25
    "단기납": 25
    "무해지": 25
    "저해지": 25
    "즉시연금": 25
    "종신보험": 20
    "정기보험": 20
    "생명보험": 20
    "생명보험협회": 35
    "연금보험": 30
    "사망보험금": 25
    "보험수익자": 20
    "계약자적립액": 25
    # 업권 공통 (15~20점대)
    "보험업권": 20
    "보험회사": 8
    "보험상품": 15
    "보험금": 8
    # 판매채널·모집 (15~25점대)
    "GA": 15
    "법인보험대리점": 20
    "보험설계사": 15
    "모집질서": 20
    "불완전판매": 20
