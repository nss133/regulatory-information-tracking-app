    - "손해사정"
    - "시세조종"

  medium_keywords:                     # 일반 민·상·노동 → MEDIUM
    - "상법"
    - "민법"
    - "민사소송법"
    - "근로기준법"
    - "노동조합"
    - "단체교섭"
    - "임금"
    - "헌법불합치"
    - "사해행위"
    - "회생"
    - "도산"
    - "손해배상"
    - "유류분"

  low_keywords:                        # 무관 사안 → LOW (우선순위 최상)
    - "공제"
    - "취득세"
    - "양도세"
    - "양도소득세"
    - "상속세"
    - "종합소득세"
    - "법인세"
    - "지방세"
    - "수도급수"
