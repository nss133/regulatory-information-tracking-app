# 법률 태그 shadow 계층. importance·relevance·메일 노출에는 사용하지 않는다.
tagging:
  enabled: true
  node_path: "/usr/local/bin/node"
  bridge_path: "scripts/news_tag_bridge.mjs"
  manifest_path: "vendor/legal-opinion-tagger/manifest.json"
  trusted_body_sources:
    - scourt
    - na
  max_text_chars: 12000
  batch_size: 200
  timeout_seconds: 120

# published_at이 N일 이내인 항목만 발송 (오래된 자료 제외). 기본 7일
filter:
  max_days_since_published: 7

llm:
  enabled: true
  provider: "deepseek"
  api_key_env: "DEEPSEEK_API_KEY"
  base_url: "https://api.deepseek.com/v1"
  model: "deepseek-chat"
  only_when_importance_at_least: "medium"

archive:
  enabled: true
  kordoc_cli_path: "/Users/nsss/.claude/plugins/marketplaces/korean-law-marketplace/node_modules/kordoc/dist/cli.js"
  attachment_sleep_seconds: 0.7   # 첨부파일 다운로드 간격 (초)
  max_attachment_size_mb: 20      # 최대 첨부파일 크기
  sources_for_attachments:        # 첨부파일 수집 우선 소스
    - fsc
    - fss
    - kftc
  body_harvest_days: 30           # body text 소급 수집 범위 (일)
  body_harvest_limit: 100         # 1회 실행당 body 수집 최대 건수
  attachment_harvest_limit: 200   # 1회 실행당 첨부파일 추출 최대 건수


# 판단자산(J-ID) 영향 감시 — 규제동향이 판단 근거 법령·판례를 건드리면
# 메일 상단 배너 + vault 감시 로그에 재검토 후보로 표시
jid_watch:
  enabled: true
  judgments_dir: "/Users/nsss/obsidian/nss/05. 지식베이스/법무판단/판단"
  log_note: "/Users/nsss/obsidian/nss/05. 지식베이스/법무판단/_규제동향_영향감시.md"

sanity:
  log_note: "/Users/nsss/obsidian/nss/05. 지식베이스/법무판단/_브리핑_자가진단.md"
